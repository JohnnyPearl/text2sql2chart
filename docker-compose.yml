version: '3.8'

services:
  # JSON API Server - Serves chart data
  api-server:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: grafana-api-server
    ports:
      - "5000:5000"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=5000
      - LOG_LEVEL=INFO
    networks:
      - grafana-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Grafana - Visualization platform
  grafana:
    image: grafana/grafana:latest
    container_name: grafana-visualization
    ports:
      - "3000:3000"
    environment:
      # Credentials come from .env (docker compose loads it automatically)
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:?set GRAFANA_USER in .env}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD in .env}
      - GF_INSTALL_PLUGINS=simpod-json-datasource
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_LOG_LEVEL=info
    networks:
      - grafana-network
    depends_on:
      api-server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  grafana-network:
    driver: bridge
