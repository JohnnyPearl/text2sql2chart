[project]
name = "text2sql2chart"
version = "1.0.0"
description = "VizMon: a natural-language visualization agent for HPC monitoring (Text-to-SQL charts and live Grafana panels)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Ngoc-Phu Dang" },
    { name = "Viet-Hung Nguyen" },
    { name = "Thai-An Pham" },
]
keywords = ["sql", "visualization", "grafana", "ai", "database", "charts", "analytics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Visualization",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "chromadb>=1.3.4",
    "nbformat>=5.10.4",
    "openai>=2.7.1",
    "vanna>=0.7.9",
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "requests>=2.31.0",
    "google-generativeai>=0.8.0",
    "google-cloud-aiplatform>=1.38.0",
    "psycopg2-binary>=2.9.0",
    "influxdb-client>=1.36.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "ruff>=0.0.286",
    "mypy>=1.5.0",
]

[project.scripts]
text2sql2chart = "text2sql2chart.cli.commands:main"
t2s2c = "text2sql2chart.cli.commands:main"

[project.urls]
Homepage = "https://github.com/yourusername/text2sql2chart"
Documentation = "https://github.com/yourusername/text2sql2chart#readme"
Repository = "https://github.com/yourusername/text2sql2chart"
Issues = "https://github.com/yourusername/text2sql2chart/issues"

[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
text2sql2chart = ["py.typed"]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=src/text2sql2chart --cov-report=html --cov-report=term-missing"
